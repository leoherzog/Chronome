name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}

    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Shell in metadata.json.
        include:
          - {gnome: 45, fedora: 39, archived: true}
          - {gnome: 51, fedora: 45}

    steps:
      - name: Point dnf at the Fedora archive
        if: matrix.archived
        run: |
          sed -i -e 's/^metalink=/#metalink=/' \
              -e 's|^#baseurl=http://download.example/pub/fedora/linux|baseurl=https://archives.fedoraproject.org/pub/archive/fedora/linux|' \
              /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora-updates.repo
          rm -f /etc/yum.repos.d/fedora-cisco-openh264.repo

      - name: Install gjs and Evolution Data Server
        run: dnf -y install --setopt=install_weak_deps=False gjs evolution-data-server dbus-daemon glib2 tzdata git-core

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tests
        run: ./run-tests.sh

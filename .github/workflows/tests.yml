name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs

      - name: Run tests
        run: ./run-tests.sh
